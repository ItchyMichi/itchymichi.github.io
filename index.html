<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>書き取り · Kanji Practice</title>
<style>
:root{
  --paper:#f6f2e7; --paper2:#eee8d8; --card:#fcf9f1; --ink:#26262e;
  --ink2:#6c6c78; --line:#ded6c2; --indigo:#39497c; --indigo2:#2b3861;
  --shu:#c2402f; --ok:#40704f; --grid:#d9cfae; --bad:#a3352a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Segoe UI,sans-serif;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); height:100%;}
body{display:flex; flex-direction:column; min-height:100dvh;}
header.top{padding:calc(env(safe-area-inset-top) + 10px) 18px 8px;
  display:flex; align-items:baseline; gap:10px;}
header.top h1{font-family:var(--serif); font-size:21px; margin:0; letter-spacing:.04em;}
header.top .media{color:var(--ink2); font-size:13px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; flex:1;}
main{flex:1; overflow-y:auto; padding:4px 14px 96px; -webkit-overflow-scrolling:touch;}
nav.tabbar{position:fixed; left:0; right:0; bottom:0; display:flex;
  background:color-mix(in srgb, var(--card) 92%, white); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); z-index:30;}
nav.tabbar button{flex:1; background:none; border:0; padding:10px 0 8px;
  font-family:var(--sans); font-size:11px; color:var(--ink2); cursor:pointer;}
nav.tabbar button .g{display:block; font-family:var(--serif); font-size:19px; line-height:1.25;}
nav.tabbar button.active{color:var(--indigo); font-weight:600;}
h2.sect{font-size:13px; text-transform:uppercase; letter-spacing:.12em;
  color:var(--ink2); margin:18px 4px 8px; font-weight:600;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; margin:10px 0; box-shadow:0 1px 2px rgba(70,60,30,.06);}
.card .row{display:flex; align-items:center; gap:10px;}
.badge{font-size:11px; padding:3px 9px; border-radius:99px; font-weight:600;
  background:var(--paper2); color:var(--ink2); white-space:nowrap;}
.badge.new{background:var(--indigo); color:#fff;}
.badge.review{background:#e6e9f4; color:var(--indigo);}
.badge.overdue{background:#f6e3df; color:var(--shu);}
.kchips{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
.kchips span{font-family:var(--serif); font-size:17px; background:var(--paper2);
  border:1px solid var(--line); border-radius:8px; padding:2px 8px;}
.btn{appearance:none; border:0; border-radius:12px; padding:12px 18px;
  font-size:15px; font-weight:600; font-family:var(--sans); cursor:pointer;
  color:#fff; background:var(--indigo);}
.btn:active{background:var(--indigo2);}
.btn.ghost{background:transparent; color:var(--indigo); border:1.5px solid var(--indigo);}
.btn.quiet{background:var(--paper2); color:var(--ink);}
.btn.small{padding:8px 12px; font-size:13px; border-radius:10px;}
.btn.danger{background:transparent; color:var(--shu); border:1.5px solid var(--shu);}
.btn:disabled{opacity:.4;}
.btnrow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--indigo); outline-offset:2px;}
.hero{margin-top:14vh; text-align:center;}
.hero .glyph{font-family:var(--serif); font-size:64px; line-height:1;}
.hero h2{font-family:var(--serif); font-weight:500; font-size:22px; margin:14px 0 6px;}
.hero p{color:var(--ink2); font-size:14px; max-width:300px; margin:0 auto 18px; line-height:1.5;}
.points{font-variant-numeric:tabular-nums; color:var(--ink2); font-size:13px;}

/* ---------- session ---------- */
.sess-top{display:flex; align-items:center; gap:10px; padding:6px 2px;}
.sess-top .prog{flex:1; text-align:center; color:var(--ink2); font-size:13px;}
.stage{margin:8px 0 0; text-align:center;}
.stepname{font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--indigo); font-weight:700; min-height:16px;}
.stephint{color:var(--ink2); font-size:14px; margin-top:4px; min-height:20px;}
.orb{width:120px; height:120px; margin:20px auto; border-radius:50%;
  border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:44px; color:var(--indigo);
  background:radial-gradient(circle at 35% 30%, #fff 0%, var(--card) 70%);
  transition:transform .25s, border-color .25s;}
.orb.listen{border-color:var(--indigo); animation:pulse 1.6s ease-in-out infinite;}
.orb.speak{border-color:var(--shu); color:var(--shu); animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sentence{font-family:var(--serif); font-size:26px; line-height:2.1; margin:14px 6px;
  text-align:left; word-break:break-word;}
.sentence rt{font-size:11px; color:var(--ink2);}
.sentence .sub{display:block; font-size:14px; color:var(--ink2); line-height:1.6;}
.padwrap{margin:10px 0; border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:
   repeating-linear-gradient(0deg, transparent 0 45px, var(--grid) 45px 46px),
   repeating-linear-gradient(90deg, transparent 0 45px, var(--grid) 45px 46px),
   var(--card);}
canvas.pad{display:block; width:100%; height:300px; touch-action:none;}
.padtools{display:flex; gap:8px; padding:8px; background:var(--card);
  border-top:1px dashed var(--line);}
.hanko{position:fixed; left:50%; top:38%; width:110px; height:110px; margin-left:-55px;
  border:4px solid var(--shu); color:var(--shu); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:52px; background:rgba(252,249,241,.7);
  transform:rotate(-8deg); z-index:50; pointer-events:none;
  animation:stamp .5s cubic-bezier(.2,1.6,.4,1);}
.hanko.no{border-color:var(--ink2); color:var(--ink2);}
@keyframes stamp{from{transform:scale(1.7) rotate(-20deg); opacity:0}
  to{transform:scale(1) rotate(-8deg); opacity:1}}
.marks{display:flex; gap:14px; justify-content:center; margin:12px 0;}
.markbtn{width:76px; height:76px; border-radius:50%; font-size:34px; border:3px solid;
  background:var(--card); cursor:pointer; font-family:var(--serif);}
.markbtn.ok{color:var(--shu); border-color:var(--shu);}
.markbtn.no{color:var(--ink2); border-color:var(--ink2);}

/* ---------- library ---------- */
.pagerow{display:flex; align-items:center; gap:10px; padding:12px 4px;
  border-bottom:1px solid var(--line);}
.pagerow .pn{font-family:var(--serif); font-size:17px; width:56px;}
.pagerow .meta{flex:1; color:var(--ink2); font-size:12px;}
.pagerow .kmini{font-family:var(--serif); font-size:15px; color:var(--ink);}
.sentrow{display:flex; gap:10px; padding:10px 2px; border-bottom:1px dashed var(--line);
  align-items:flex-start;}
.sentrow .t{font-family:var(--serif); font-size:18px; line-height:1.9; flex:1;}
.playb{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--indigo);
  background:var(--card); color:var(--indigo); font-size:16px; flex:none; cursor:pointer;}
.playb.on{background:var(--indigo); color:#fff;}

/* ---------- games ---------- */
.gamegrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.gamecard{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; text-align:center; cursor:pointer;}
.gamecard .icon{font-family:var(--serif); font-size:30px;}
.gamecard h3{margin:6px 0 2px; font-size:15px;}
.gamecard p{margin:0; color:var(--ink2); font-size:12px;}
.gwrap{margin-top:8px;}
.gword{font-family:var(--serif); font-size:24px; line-height:2.2; word-break:break-word;}
.blankb{display:inline-block; min-width:1.35em; border-bottom:3px solid var(--indigo);
  color:var(--indigo); font-family:var(--serif); text-align:center; background:none;
  border-top:0; border-left:0; border-right:0; font-size:24px; padding:0 2px; cursor:pointer;}
.blankb.good{color:var(--ok); border-color:var(--ok);}
.blankb.bad{color:var(--bad); border-color:var(--bad);}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--card);
  border-top-left-radius:20px; border-top-right-radius:20px; z-index:60;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);
  box-shadow:0 -8px 30px rgba(40,30,10,.18);}
.sheet .opts{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
.opt{font-family:var(--serif); font-size:26px; width:60px; height:60px;
  border-radius:12px; border:1.5px solid var(--line); background:var(--paper2); cursor:pointer;}
.gwrap{max-width:920px; margin:0 auto;}
.crystalpanel{background:#1d2733; border-radius:var(--r); padding:20px 8px 24px; margin-top:12px;}
.crystalrow{display:flex; justify-content:center; align-items:flex-end; gap:16px; flex-wrap:wrap;}
canvas.crystalC{width:126px; height:190px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  border-radius:8px;}
.ctarget{width:148px; height:148px; border-radius:50%; background:#f7fbff; border:6px solid #4fb3bf;
  margin:8px auto 4px; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:900; font-size:90px; color:#17212b;}
.fhead{text-align:center; margin:2px 0 8px;}
.fsent{font-family:var(--serif); font-size:19px; line-height:1.9;}
.fsent .blank{color:var(--indigo); font-weight:700;}
.fsent .rhint{font-size:13px; color:var(--indigo);}
.ftarget{font-family:var(--serif); font-weight:900; font-size:46px; color:var(--indigo); line-height:1.2;}
.wrow{display:flex; gap:16px; justify-content:center; align-items:center;
  margin:10px 0 4px; flex-wrap:wrap;}
.wdemo{border:1px solid var(--line); border-radius:10px; background:var(--card);
  display:flex; align-items:center; justify-content:center; overflow:hidden;}
.wdemo svg{width:100%; height:100%;}
.wcell{position:relative; border:1.5px solid var(--line); border-radius:10px;
  background:var(--card);
  background-image:
    linear-gradient(to right,transparent 49.4%,rgba(38,38,46,.10) 49.4%,
      rgba(38,38,46,.10) 50.6%,transparent 50.6%),
    linear-gradient(to bottom,transparent 49.4%,rgba(38,38,46,.10) 49.4%,
      rgba(38,38,46,.10) 50.6%,transparent 50.6%);}
.wghost{position:absolute; inset:0; pointer-events:none;}
.wghost svg{width:100%; height:100%;}
.wcell canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
.wstrip{display:flex; gap:6px; justify-content:center; margin:8px 0 2px;
  min-height:50px; flex-wrap:wrap;}
.wstrip canvas{width:46px; height:46px; border:1px solid var(--line);
  border-radius:6px; background:var(--card);}
.bigk{font-family:var(--serif); font-size:96px; text-align:center; margin:20px 0;}
canvas.gcanvas{display:block; width:100%; border:1px solid var(--line);
  border-radius:var(--r); background:var(--card); touch-action:none;}
.gstat{display:flex; justify-content:space-between; color:var(--ink2);
  font-size:13px; margin:8px 2px;}

/* ---------- misc ---------- */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:90px;
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:99px;
  font-size:14px; z-index:80; opacity:0; transition:opacity .25s;}
.toast.show{opacity:1;}
.overlay{position:fixed; inset:0; background:rgba(246,242,231,.94); z-index:70;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
.bar{width:70%; max-width:340px; height:8px; background:var(--paper2);
  border-radius:99px; overflow:hidden;}
.bar>div{height:100%; width:0%; background:var(--indigo); transition:width .15s;}
label.field{display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); font-size:15px;}
label.field input[type=range]{flex:1; max-width:150px;}
label.field .val{color:var(--ink2); font-size:13px; width:44px; text-align:right;}
select,input[type=date]{font-size:15px; padding:6px; border-radius:8px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<header class="top"><h1>書き取り</h1><div class="media" id="mediaName"></div>
  <div class="points" id="pointsTop"></div></header>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button data-v="today"><span class="g">今</span>Today</button>
  <button data-v="library"><span class="g">庫</span>Library</button>
  <button data-v="games"><span class="g">遊</span>Games</button>
  <button data-v="settings"><span class="g">設</span>Settings</button>
</nav>
<input type="file" id="zipInput" accept=".zip,application/zip,application/x-zip-compressed" hidden>
<div id="toast" class="toast"></div>
<script>
"use strict";
/* ================================================================== core */
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}

const app={deck:null,schedule:null,view:"today",sub:null,session:null,paused:false};
const BUILD="2026-08-09b";
const DEFAULT_CFG={rate:1.0,beepDelay:4,repeats:2,furigana:true,showTextDuring:false,
  games:{blanks:true,crystal:true,tileswap:true,cube:true,faces:true,write:true},
  gsize:{blanks:1,crystal:1,tileswap:1,cube:1,faces:1,write:1}};
const gscale=id=>((cfg.gsize&&cfg.gsize[id])||1);
let cfg={...DEFAULT_CFG};
let P={doneMap:{},marks:{},points:{total:0,byDay:{}}};   // progress
let saveT=null;
function saveProgress(){clearTimeout(saveT);saveT=setTimeout(()=>kvSet("progress",P),300);}
function addPoints(n){const d=todayStr();P.points.total+=n;P.points.byDay[d]=(P.points.byDay[d]||0)+n;saveProgress();paintPoints();}
function paintPoints(){$("#pointsTop").textContent=P.points.total?`◈ ${P.points.total}`:"";}

/* ------------------------------------------------------------ IndexedDB */
let _db=null;
function db(){return _db??=new Promise((res,rej)=>{
  const r=indexedDB.open("kanji-practice",1);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains("files"))d.createObjectStore("files");
    if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const rp=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
async function kvGet(k){return rp((await db()).transaction("kv").objectStore("kv").get(k));}
async function kvSet(k,v){const tx=(await db()).transaction("kv","readwrite");
  tx.objectStore("kv").put(v,k);return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function fileGet(p){return rp((await db()).transaction("files").objectStore("files").get(p));}
async function filePut(p,b){const tx=(await db()).transaction("files","readwrite");
  tx.objectStore("files").put(b,p);return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function clearLegacyClips(){
  // remove per-clip records from the old import scheme (and any stale zip)
  try{
    const d=await db();const tx=d.transaction("files","readwrite");
    const st=tx.objectStore("files");
    await new Promise((res,rej)=>{
      const cur=st.openCursor();
      cur.onerror=()=>rej(cur.error);
      cur.onsuccess=ev=>{const c=ev.target.result;
        if(!c)return res();
        const k=String(c.key);
        if(k.startsWith("clips/")||k==="deck.zip")c.delete();
        c.continue();};});
  }catch(_){}}

async function ensureZip(){
  if(app.zip)return app.zip;
  const f=await fileGet("deck.zip");
  if(!f)throw new Error("audio archive missing — import the deck zip again");
  let index=await kvGet("zipIndex");
  if(!index){
    const parsed=await readZip(f);index={};
    for(const e of parsed.entries)
      if(e.name.startsWith("clips/"))
        index[e.name]={off:e.off,csize:e.csize,usize:e.usize,method:e.method};
    await kvSet("zipIndex",index);}
  app.zip={file:f,index};
  return app.zip;}

async function wipeAll(){const d=await db();for(const s of["files","kv"]){
  const tx=d.transaction(s,"readwrite");tx.objectStore(s).clear();
  await new Promise(r=>tx.oncomplete=r);}}

/* ------------------------------------------------------------ zip reader */
//== ZIP ==
async function readZip(file){
  const tailSize=Math.min(file.size,65578);
  const tail=new Uint8Array(await file.slice(file.size-tailSize).arrayBuffer());
  let eocd=-1;
  for(let i=tail.length-22;i>=0;i--){
    if(tail[i]===0x50&&tail[i+1]===0x4b&&tail[i+2]===0x05&&tail[i+3]===0x06){eocd=i;break;}}
  if(eocd<0)throw new Error("Not a zip file");
  const dv=new DataView(tail.buffer,tail.byteOffset+eocd,22);
  const cdSize=dv.getUint32(12,true),cdOff=dv.getUint32(16,true);
  const cd=new Uint8Array(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());
  const entries=[];let p=0;const td=new TextDecoder();
  while(p+46<=cd.length){
    const v=new DataView(cd.buffer,cd.byteOffset+p,46);
    if(v.getUint32(0,true)!==0x02014b50)break;
    const method=v.getUint16(10,true),csize=v.getUint32(20,true),usize=v.getUint32(24,true);
    const nlen=v.getUint16(28,true),elen=v.getUint16(30,true),clen=v.getUint16(32,true);
    const off=v.getUint32(42,true);
    const name=td.decode(cd.subarray(p+46,p+46+nlen));
    entries.push({name,method,csize,usize,off});
    p+=46+nlen+elen+clen;}
  return {file,entries};}
async function zipEntryBlob(zip,entry,mime){
  const head=new DataView(await zip.file.slice(entry.off,entry.off+30).arrayBuffer());
  if(head.getUint32(0,true)!==0x04034b50)throw new Error("Bad local header: "+entry.name);
  const nlen=head.getUint16(26,true),elen=head.getUint16(28,true);
  const start=entry.off+30+nlen+elen;
  const comp=zip.file.slice(start,start+entry.csize);
  if(entry.method===0)return mime?new Blob([comp],{type:mime}):comp;
  if(entry.method===8){
    if(typeof DecompressionStream==="undefined")
      throw new Error("This browser lacks DecompressionStream (needs iOS 16.4+)");
    const stream=comp.stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const blob=await new Response(stream).blob();
    return mime?new Blob([blob],{type:mime}):blob;}
  throw new Error("Unsupported zip compression: "+entry.method);}
//== ENDZIP ==

/* --------------------------------------------------------------- import */
function guessMime(n){return n.endsWith(".wav")?"audio/wav":n.endsWith(".m4a")||n.endsWith(".m4b")?"audio/mp4":n.endsWith(".ogg")?"audio/ogg":"audio/mpeg";}
async function importZip(file){
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div style="font-family:var(--serif);font-size:40px">読</div>
    <div id="ovMsg">Reading zip…</div><div class="bar"><div id="ovBar"></div></div>
    <div style="font-size:11px;opacity:.55;margin-top:8px">build ${BUILD}</div>`;
  document.body.appendChild(ov);
  const say=(m,f)=>{$("#ovMsg").textContent=m;if(f!=null)$("#ovBar").style.width=(f*100).toFixed(0)+"%";};
  try{
    const zip=await readZip(file);
    const find=n=>zip.entries.find(e=>e.name===n);
    const de=find("deck.json"),se=find("schedule.json");
    if(!de&&se){ // schedule-only update
      const sch=JSON.parse(await(await zipEntryBlob(zip,se)).text());
      if(!app.deck||app.deck.media.id!==sch.media_id){
        toast("Schedule is for a different media — import its full deck first");}
      else{app.schedule=sch;await kvSet("schedule",sch);toast("Schedule updated");}
      ov.remove();render();return;}
    if(!de)throw new Error("deck.json not found — is this a practice deck zip?");
    say("Reading deck…",0.02);
    const deck=JSON.parse(await(await zipEntryBlob(zip,de)).text());
    const sch=se?JSON.parse(await(await zipEntryBlob(zip,se)).text()):null;
    const ste=find("strokes.json");
    const strokes=ste?JSON.parse(await(await zipEntryBlob(zip,ste)).text()):null;
    const clips=zip.entries.filter(e=>e.name.startsWith("clips/")&&!e.name.endsWith("/"));
    const index={};
    for(const e of clips)index[e.name]={off:e.off,csize:e.csize,usize:e.usize,method:e.method};
    say(`Saving deck to device storage… (${(file.size/1e6).toFixed(0)} MB, one-off — can take a minute)`,0.5);
    await clearLegacyClips();
    await filePut("deck.zip",file);
    await kvSet("zipIndex",index);
    app.zip=null;                    // lazy-open from storage on first play
    const names=Object.keys(index);
    if(names.length){
      say("Verifying audio archive…",0.93);
      const stored=await fileGet("deck.zip");
      if(!stored||stored.size!==file.size)
        throw new Error("the archive did not save fully — free up space and retry");
      const probe=await zipEntryBlob({file:stored},index[names[0]],guessMime(names[0]));
      const head=new Uint8Array(await probe.slice(0,4).arrayBuffer());
      if(!probe.size||!head.length)
        throw new Error("stored archive unreadable — please retry the import");}
    app.deck=deck;app.schedule=sch;
    app.strokes=strokes?strokes.strokes:null;
    await kvSet("deck",deck);if(sch)await kvSet("schedule",sch);
    await kvSet("strokes",app.strokes);
    try{await navigator.storage?.persist?.();}catch(_){}
    say("Done",1);toast(`Imported: ${deck.media.title}`);
  }catch(err){alert("Import failed: "+err.message);}
  ov.remove();render();}

/* ================================================================ audio */
let AC=null;
function ac(){AC??=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();return AC;}
function tone(freq=880,dur=0.32,vol=0.35,type="sine"){
  try{const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(vol,c.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+dur+0.05);}catch(_){}}
const beep=()=>tone(880,0.4,0.4);
const sfxGood=()=>{tone(660,0.12,0.25);setTimeout(()=>tone(990,0.16,0.25),90);};
const sfxBad=()=>tone(180,0.25,0.3,"square");

const audioEl=new Audio();
audioEl.preservesPitch=true; audioEl.setAttribute("playsinline","");
const SILENT_WAV="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=";
function unlockAudio(){try{ac();audioEl.src=SILENT_WAV;audioEl.play().catch(()=>{});}catch(_){}}

const urlCache=new Map();
async function clipUrl(path){
  if(urlCache.has(path)){const u=urlCache.get(path);urlCache.delete(path);urlCache.set(path,u);return u;}
  let blob=await fileGet(path).catch(()=>null);   // decks imported the old way
  if(!blob){
    const z=await ensureZip();
    const meta=z.index[path];
    if(!meta)throw new Error("clip missing: "+path);
    blob=await zipEntryBlob({file:z.file},meta,guessMime(path));
    blob=new Blob([await blob.arrayBuffer()],{type:guessMime(path)});}
  const url=URL.createObjectURL(blob);
  urlCache.set(path,url);
  if(urlCache.size>24){const k=urlCache.keys().next().value;
    URL.revokeObjectURL(urlCache.get(k));urlCache.delete(k);}
  return url;}

async function playClip(s,tok){
  if(!s.clip){await wait(800,tok);return;}
  let url;try{url=await clipUrl(s.clip);}
  catch(err){
    if(!app._audioErrToasted){app._audioErrToasted=true;
      toast("Audio unavailable: "+(err&&err.message||err));}
    await wait(500,tok);return;}
  if(audioEl.src!==url)audioEl.src=url;
  audioEl.currentTime=0;audioEl.playbackRate=cfg.rate;
  try{await audioEl.play();}catch(_){}
  await new Promise(res=>{
    let done=false;const fin=()=>{if(done)return;done=true;clearInterval(iv);
      audioEl.removeEventListener("ended",fin);res();};
    const iv=setInterval(()=>{
      if(tok&&tok.c){audioEl.pause();fin();return;}
      if(app.paused&&!audioEl.paused)audioEl.pause();
      else if(!app.paused&&audioEl.paused&&!audioEl.ended)audioEl.play().catch(()=>{});
      if(audioEl.ended)fin();},100);
    audioEl.addEventListener("ended",fin);});}

async function wait(ms,tok){let left=ms;
  while(left>0){if(tok&&tok.c)return;await sleep(100);if(!app.paused)left-=100;}}

function showSentence(s,withFuri){

function rubyParts(s){
  const plain=esc(s.text);
  const rd=s.reading&&s.reading!==s.text?s.reading:null;
  if(rd&&/[\[《]/.test(rd)){
    const ruby=esc(rd).replace(/([\u3400-\u9fff々]+)[\[《]([^\]》]+)[\]》]/g,
      "<ruby>$1<rt>$2</rt></ruby>");
    return {plain,ruby,sub:null};}
  return {plain,ruby:plain,sub:rd?esc(rd):null};}

async function runFlow(s){
  const tok={c:false};flowTok=tok;
  const dur=(s.end!=null&&s.start!=null)?Math.max(0.8,s.end-s.start):2.5;
  if(cfg.showTextDuring)showSentence(s,cfg.furigana);
  for(let i=1;i<=cfg.repeats;i++){
    setStep("listen",`Listen ${"①②③④"[i-1]??i}`,"just listen");
    await playClip(s,tok);if(tok.c)return;
    if(i<cfg.repeats)await wait(700,tok);if(tok.c)return;}
  setStep("ready","Get ready…",`beep in ${cfg.beepDelay}s — then say the line`);
  await wait(cfg.beepDelay*1000,tok);if(tok.c)return;
  beep();
  setStep("speak","Your turn","say the whole line aloud");
  await wait(Math.max(cfg.beepDelay,dur*1.25+1)*1000,tok);if(tok.c)return;
  setStep("listen","Listen again","how close were you?");
  await playClip(s,tok);if(tok.c)return;
  setStep("write","Write the line","from memory — reveal when done");
  $("#padZone").hidden=false;initPad($("#padCanvas"));
  await new Promise(res=>{const b=$("#padReveal");if(!b)return res();
    b.onclick=res;const iv=setInterval(()=>{if(tok.c){clearInterval(iv);res();}},150);});
  if(tok.c)return;
  showSentence(s,cfg.furigana);
  setStep("check","Check your writing","compare, then stamp yourself");
  $("#markZone").hidden=false;
  const ok=await new Promise(res=>{
    $("#markOk").onclick=()=>res(true);$("#markNo").onclick=()=>res(false);
    const iv=setInterval(()=>{if(tok.c){clearInterval(iv);res(null);}},150);});
  if(tok.c||ok===null)return;
  P.marks[`${todayStr()}|${s.id}`]=ok;saveProgress();
  addPoints(ok?2:1);stamp(ok);(ok?sfxGood:sfxBad)();
  await wait(650,tok);if(tok.c)return;
  nextSentence();}

/* ------------------------------------------------------------ writing pad */
let pad=null;
function initPad(canvas){
  if(!canvas)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=canvas.clientWidth||340,h=300;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const g=canvas.getContext("2d");g.scale(dpr,dpr);
  g.lineCap="round";g.lineJoin="round";
  pad={canvas,g,strokes:[],cur:null,w,h};
  const pos=e=>{const r=canvas.getBoundingClientRect();
    return [e.clientX-r.left,e.clientY-r.top,e.pressure&&e.pressure>0?e.pressure:0.5];};
  canvas.addEventListener("pointerdown",e=>{e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pad.cur={pts:[pos(e)]};pad.strokes.push(pad.cur);drawPad();});
  canvas.addEventListener("pointermove",e=>{if(!pad.cur)return;
    for(const ev of (e.getCoalescedEvents?e.getCoalescedEvents():[e]))
      pad.cur.pts.push(pos(ev));
    drawPad();});
  const up=()=>{pad.cur=null;};
  canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
  $("#padUndo").onclick=()=>{pad.strokes.pop();drawPad();};
  $("#padClear").onclick=()=>padClear();}
function padClear(){if(pad){pad.strokes=[];drawPad();}}
function drawPad(){
  if(!pad)return;const {g,w,h,strokes}=pad;
  g.clearRect(0,0,w,h);
  g.strokeStyle="#26262e";
  for(const st of strokes){
    if(st.pts.length===1){const [x,y,p]=st.pts[0];
      g.beginPath();g.arc(x,y,1.6+p*2,0,7);g.fillStyle="#26262e";g.fill();continue;}
    for(let i=1;i<st.pts.length;i++){
      const [x0,y0]=st.pts[i-1],[x1,y1,p1]=st.pts[i];
      g.lineWidth=2.2+p1*3.2;
      g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}}}

let gameCleanup=null;
function stopGame(){if(gameCleanup){try{gameCleanup();}catch(_){}gameCleanup=null;}
  document.querySelectorAll(".sheet").forEach(s=>s.remove());}

function defaultKanji(){
  const due=dueEvents();
  const set=[...new Set(due.flatMap(e=>e.kanji))];
  if(set.length)return set;
  return shuffle(Object.keys(app.deck?.kanji||{})).slice(0,8);}
function gameCtx(){
  const targets=(app.gameKanji&&app.gameKanji.length?app.gameKanji:defaultKanji()).slice(0,10);
  const all=Object.keys(app.deck.kanji);
  return {targets,
    decoys(k,n){const pool=[...(app.deck.kanji[k]?.decoys||[])].filter(x=>x!==k);
      for(const t of shuffle(all)){if(pool.length>=n)break;
        if(t!==k&&!pool.includes(t))pool.push(t);}
      return pool.slice(0,n);},   // deck order = similarity-ranked, hardest first
    sentenceFor(k){const c=app.deck.sentences.filter(s=>s.kanji&&s.kanji.includes(k));
      return c.length?c[Math.random()*c.length|0]:null;}};}

function glyphCanvas(k,size){
  const c=document.createElement("canvas");c.width=c.height=size;
  const g=c.getContext("2d");
  g.fillStyle="#fcf9f1";g.fillRect(0,0,size,size);
  g.fillStyle="#26262e";g.textAlign="center";g.textBaseline="middle";
  g.font=`${Math.round(size*0.82)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
  g.fillText(k,size/2,size/2+size*0.04);
  return c;}

function renderGames(v){
  if(!app.deck){v.innerHTML=`<div class="hero"><p>No deck loaded yet.</p></div>`;return;}
  const ctx=gameCtx();

    c.onclick=()=>{unlockAudio();setView("game",c.dataset.game);});}

function renderGameRun(v){

const gameTiles={title:"Tile swap",icon:"田",blurb:"reassemble the character",
 run(el,ctx,done){
  let round=0,score=0,moves=0;const ROUNDS=3,N=3;
  const targets=shuffle(ctx.targets);

    const size=Math.min(el.clientWidth-8,Math.round(330*gscale("tileswap"))),ts=size/N;
    const glyph=glyphCanvas(k,size*2);
    let perm=[...Array(N*N).keys()],sel=-1,movable=false;
    el.innerHTML=`<div class="gstat"><span>character ${round}/${Math.min(ROUNDS,targets.length)}</span>
        <span id="tMoves">0 swaps · ◈ ${score}</span></div>

        width:${size}px;margin:8px auto;"></div>
      <div class="stephint" id="tHint" style="text-align:center">memorise…</div>`;
    const grid=el.querySelector("#tGrid"),tiles=[];
    for(let i=0;i<N*N;i++){
      const c=document.createElement("canvas");
      c.width=c.height=ts*2;
      c.style.cssText=`width:${ts-2}px;height:${ts-2}px;border-radius:8px;
        border:2px solid var(--line);background:var(--card);cursor:pointer`;
      grid.appendChild(c);tiles.push(c);
      c.onclick=()=>{
        if(!movable)return;
        if(sel<0){sel=i;c.style.borderColor="var(--indigo)";return;}
        if(sel===i){sel=-1;c.style.borderColor="var(--line)";return;}
        [perm[sel],perm[i]]=[perm[i],perm[sel]];moves++;score=Math.max(0,score);
        tiles[sel].style.borderColor="var(--line)";sel=-1;draw();
        el.querySelector("#tMoves").textContent=`${moves} swaps · ◈ ${score}`;
        if(perm.every((v,x)=>v===x)){
          score+=Math.max(4,12-moves);sfxGood();setTimeout(next,800);}};}
    const draw=()=>{for(let i=0;i<N*N;i++){
      const g=tiles[i].getContext("2d"),src=perm[i];
      g.clearRect(0,0,ts*2,ts*2);
      g.drawImage(glyph,(src%N)*ts*2,(src/N|0)*ts*2,ts*2,ts*2,0,0,ts*2,ts*2);}};
    draw();
    setTimeout(()=>{
      do{perm=shuffle(perm);}while(perm.every((v,i)=>v===i));
      movable=true;draw();
      el.querySelector("#tHint").textContent="tap two tiles to swap them";},1200);};
  next();}};

const gameCube={title:"Kanji cube",icon:"回",blurb:"swipe rows & columns back into place",
 run(el,ctx,done){
  let round=0,score=0;const ROUNDS=2,N=3;
  const targets=shuffle(ctx.targets);
  let raf=null;gameCleanup=()=>cancelAnimationFrame(raf);
  const next=async()=>{
    if(round>=ROUNDS||round>=targets.length)return done(score,"grids restored");
    const k=targets[round];round++;
    const size=Math.min(el.clientWidth-8,Math.round(330*gscale("cube"))),ts=size/N;
    const glyph=glyphCanvas(k,size*2);
    let perm=[...Array(N*N).keys()],movable=false,movesUsed=0;
    el.innerHTML=`<div class="gstat"><span>grid ${round}/${Math.min(ROUNDS,targets.length)}</span>
        <span>◈ ${score}</span></div>
      <canvas class="gcanvas" id="cubeC" style="width:${size}px;height:${size}px;margin:8px auto"></canvas>
      <div class="stephint" id="cubeHint" style="text-align:center">memorise…</div>`;
    const cv=el.querySelector("#cubeC");cv.width=cv.height=size*2;
    const g=cv.getContext("2d");
    const draw=()=>{g.clearRect(0,0,size*2,size*2);
      for(let i=0;i<N*N;i++){const src=perm[i];
        g.drawImage(glyph,(src%N)*ts*2,(src/N|0)*ts*2,ts*2,ts*2,
          (i%N)*ts*2,(i/N|0)*ts*2,ts*2,ts*2);}
      g.strokeStyle="#d9cfae";g.lineWidth=3;
      for(let l=1;l<N;l++){g.beginPath();g.moveTo(l*ts*2,0);g.lineTo(l*ts*2,size*2);
        g.moveTo(0,l*ts*2);g.lineTo(size*2,l*ts*2);g.stroke();}};
    const rotRow=(r,d)=>{const a=perm.slice(r*N,r*N+N);
      perm.splice(r*N,N,...(d>0?[a[N-1],...a.slice(0,N-1)]:[...a.slice(1),a[0]]));};
    const rotCol=(c,d)=>{const a=[perm[c],perm[c+N],perm[c+2*N]];
      const b=d>0?[a[N-1],...a.slice(0,N-1)]:[...a.slice(1),a[0]];
      for(let r=0;r<N;r++)perm[c+r*N]=b[r];};
    draw();await sleep(1300);
    for(let m=0;m<7;m++)(Math.random()<0.5?rotRow:rotCol)(Math.random()*N|0,Math.random()<0.5?1:-1);
    if(perm.every((v,i)=>v===i))rotRow(0,1);
    draw();movable=true;
    el.querySelector("#cubeHint").textContent="swipe a row or column · rows wrap around";
    let start=null;
    const posOf=e=>{const r=cv.getBoundingClientRect();
      return [(e.clientX-r.left)/r.width*N|0,(e.clientY-r.top)/r.height*N|0,e.clientX,e.clientY];};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);start=posOf(e);};
    cv.onpointermove=e=>{
      if(!start||!movable)return;
      const dx=e.clientX-start[2],dy=e.clientY-start[3];
      if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){
        rotRow(Math.min(N-1,Math.max(0,start[1])),dx>0?1:-1);movesUsed++;start=posOf(e);draw();check();}
      else if(Math.abs(dy)>30){
        rotCol(Math.min(N-1,Math.max(0,start[0])),dy>0?1:-1);movesUsed++;start=posOf(e);draw();check();}};
    cv.onpointerup=()=>start=null;
    const check=()=>{if(perm.every((v,i)=>v===i)){movable=false;
      score+=Math.max(4,14-movesUsed);sfxGood();setTimeout(next,800);}};};
  next();}};

/* ---- 5 · kanji faces ------------------------------------------------ */
const gameFaces={title:"Kanji faces",icon:"顔",blurb:"tap the right face, walk it home",
 run(el,ctx,done){
  const targets=ctx.targets.slice(0,4);
  if(!targets.length)return done(0,"no kanji today");
  const NEED=2, MAXWRONG=3;
  const W=Math.max(300,Math.min(el.clientWidth-4,880));
  const H=Math.min(440,Math.max(320,Math.round(innerHeight*0.5)));
  const dpr=Math.min(2,devicePixelRatio||1);
  const S=gscale("faces"),HIT=27*Math.max(1,S);
  const serif='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  el.innerHTML=`<div class="gstat"><span id="fGoal"></span><span id="fScore"></span></div>
    <div class="fhead"><div class="fsent" id="fSent"></div><div class="ftarget" id="fTgt"></div></div>
    <canvas class="gcanvas" id="facesC"></canvas>
    <div class="stephint" style="text-align:center">tap the matching face — it walks home · similar kanji are decoys</div>`;
  el.querySelector("#fSent").style.fontSize=Math.round(19*S)+"px";
  el.querySelector("#fTgt").style.fontSize=Math.round(46*S)+"px";
  const cv=el.querySelector("#facesC");
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  let cur=0,found=0,hits=0,miss=0,figs=[],lastSpawn=0,over=false,raf=null,doorFlash=0;
  const houseX=W/2, houseY=H-40;
  const readingHint=(sent,k)=>{
    if(!sent||!sent.reading)return "";
    const re=/([\u3400-\u9fff々]+)\[([^\]]+)\]/g;let m;
    while((m=re.exec(sent.reading)))if(m[1].includes(k))return m[2];
    return "";};
  const setHeader=()=>{
    const k=targets[cur],sent=ctx.sentenceFor(k);
    let html="";
    if(sent){const hint=readingHint(sent,k);
      html=esc(sent.text).split(k).join(
        `<span class="blank">＿${hint?`<span class="rhint">(${esc(hint)})</span>`:""}</span>`);}
    el.querySelector("#fSent").innerHTML=html;
    el.querySelector("#fTgt").textContent=k;
    el.querySelector("#fGoal").textContent=
      targets.map((t,i)=>i<cur?"◉":i===cur?"▶":"·").join(" ")+`  find ${found}/${NEED}`;
    el.querySelector("#fScore").textContent=
      "♥".repeat(Math.max(0,MAXWRONG-miss))+` · hits ${hits}`;};
  setHeader();
  const decoysFor=k=>ctx.decoys(k,6);
  const spawn=t=>{
    if(figs.length>=8)return;
    const k0=targets[cur];
    const hasCorrect=figs.some(f=>f.state==="walk"&&f.k===k0);
    const correct=!hasCorrect||Math.random()<0.45;
    const pool=decoysFor(k0);
    const k=correct?k0:(pool[Math.random()*pool.length|0]||k0);
    const dir=Math.random()<0.5?1:-1;
    figs.push({k,dir,x:dir>0?-26:W+26,
      y:H*0.28+Math.random()*Math.max(40,H*0.60-70*S),
      vx:dir*(46+Math.random()*36),phase:Math.random()*7,
      state:"walk",flash:0,born:t});};
  const hitAt=(x,y)=>{for(let i=figs.length-1;i>=0;i--){const f=figs[i];
    if(f.state==="walk"&&(x-f.x)**2+(y-f.y-8*S)**2<HIT*HIT)return f;}return null;};
  cv.onpointerdown=e=>{
    if(over)return;
    const r=cv.getBoundingClientRect();
    const f=hitAt(e.clientX-r.left,e.clientY-r.top);
    if(!f)return;
    if(f.k===targets[cur]){f.state="home";sfxGood();}
    else{f.flash=performance.now();miss++;sfxBad();setHeader();
      if(miss>=MAXWRONG){over=true;
        setTimeout(()=>done(Math.max(0,hits*3-miss*2),"out of lives"),700);}}};
  const advance=()=>{
    found++;hits++;doorFlash=performance.now();
    if(found>=NEED){cur++;found=0;
      if(cur>=targets.length){over=true;setHeader();
        setTimeout(()=>done(Math.max(1,hits*3-miss*2),
          `all ${targets.length} kanji home`),750);return;}}
    setHeader();};
  let prev=performance.now();
  const step=t=>{
    if(over){draw(t);return;}
    const dt=Math.min(0.05,(t-prev)/1000);prev=t;
    if(t-lastSpawn>780){lastSpawn=t;spawn(t);}
    for(const f of figs){
      if(f.state==="home"){
        const tx=houseX,ty=houseY-16,dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);
        if(d<8){f.state="done";advance();}
        else{f.x+=dx/d*180*dt;f.y+=dy/d*180*dt;f.phase+=dt*13;}
        continue;}
      f.x+=f.vx*dt;f.phase+=dt*9;
      f.yb=f.y+Math.sin(f.phase*0.9)*5;}
    figs=figs.filter(f=>{
      if(f.state==="done")return false;
      if(f.flash&&t-f.flash>300){f.flash=0;}
      if(f.state==="walk"&&(f.x<-40||f.x>W+40))return false;
      return true;});
    draw(t);raf=requestAnimationFrame(step);};
  const drawFig=(f,t)=>{
    const y=(f.yb??f.y);
    const bad=f.flash&&t-f.flash<300;
    const ink=bad?"#c2402f":"#26262e";
    const sw=Math.sin(f.phase*1.6)*7*S;
    g.strokeStyle=ink;g.lineWidth=Math.max(2,2*S);g.lineCap="round";
    g.beginPath();g.moveTo(f.x,y+14*S);g.lineTo(f.x,y+34*S);g.stroke();          // torso
    g.beginPath();g.moveTo(f.x,y+34*S);g.lineTo(f.x-6*S+sw*0.6,y+52*S);g.stroke(); // legs
    g.beginPath();g.moveTo(f.x,y+34*S);g.lineTo(f.x+6*S-sw*0.6,y+52*S);g.stroke();
    g.beginPath();g.moveTo(f.x,y+20*S);g.lineTo(f.x-9*S,y+30*S+sw*0.3);g.stroke(); // arms
    g.beginPath();g.moveTo(f.x,y+20*S);g.lineTo(f.x+9*S,y+30*S-sw*0.3);g.stroke();
    g.beginPath();g.arc(f.x,y,16*S,0,7);
    g.fillStyle=bad?"#f6dfdb":"#fdfcf7";g.fill();g.stroke();                  // head
    g.fillStyle=ink;g.font=`600 ${Math.round(15*S)}px ${serif}`;
    g.textAlign="center";g.textBaseline="middle";g.fillText(f.k,f.x,y+1);};
  const drawHouse=t=>{
    const hx=houseX,hy=houseY,fl=doorFlash&&t-doorFlash<420;
    g.fillStyle="#f2d9a0";g.strokeStyle="#8a6b3a";g.lineWidth=2;
    g.fillRect(hx-34,hy-30,68,42);g.strokeRect(hx-34,hy-30,68,42);
    g.fillStyle="#7a4a2b";g.beginPath();
    g.moveTo(hx-42,hy-30);g.lineTo(hx,hy-58);g.lineTo(hx+42,hy-30);g.closePath();g.fill();
    g.fillStyle=fl?"#c9a15c":"#5b3a25";g.fillRect(hx-10,hy-14,20,26);
    g.fillStyle="#fdfcf7";g.strokeStyle="#8a6b3a";
    const k=targets[Math.min(cur,targets.length-1)];
    g.beginPath();g.roundRect(hx-18,hy-84,36,24,6);g.fill();g.stroke();
    g.fillStyle="#26262e";g.font=`700 17px ${serif}`;
    g.textAlign="center";g.textBaseline="middle";g.fillText(k,hx,hy-72);};
  const draw=t=>{
    g.clearRect(0,0,W,H);
    g.strokeStyle="rgba(38,38,46,.18)";g.lineWidth=1;
    g.beginPath();g.moveTo(0,H-12);g.lineTo(W,H-12);g.stroke();
    drawHouse(t);
    for(const f of figs)if(f.state!=="done")drawFig(f,t);};
  raf=requestAnimationFrame(step);
  el.closest("#view,body");
  const obs=new MutationObserver(()=>{
    if(!document.body.contains(cv)){cancelAnimationFrame(raf);obs.disconnect();}});
  obs.observe(document.body,{childList:true,subtree:true});}};

/* ---- 6 · writing practice ------------------------------------------ */
const gameWrite={title:"Writing practice",icon:"筆",blurb:"stroke order · trace · freehand",
 run(el,ctx,done){
  const S=gscale("write");
  const avail=ctx.targets.filter(k=>app.strokes&&app.strokes[k]&&app.strokes[k].length);
  if(!avail.length)return done(0,app.strokes
    ?"no stroke data for today's kanji"
    :"no stroke data in this deck — re-export it with the updated exporter");
  const targets=avail.slice(0,5);
  const CELL=Math.round(150*S), GHOST=[0.5,0.22,0.10,0];
  const HINTS=["watch the strokes · trace along","again, fainter guide",
               "copy the model","from memory"];
  let ki=0,score=0,animTok=0;
  gameCleanup=()=>{animTok++;};
  const startPt=d=>{const m=/[Mm][ ,]*([0-9.]+)[ ,]+([0-9.]+)/.exec(d);
    return m?[+m[1],+m[2]]:[10,10];};
  const hue=(i,n)=>`hsl(${Math.round(i*300/Math.max(1,n-1))},68%,42%)`;
  const svgFor=(k,o={})=>{
    const ds=app.strokes[k];
    return `<svg viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg">
      ${ds.map((d,i)=>`<path d="${d}" fill="none"
        stroke="${o.color?hue(i,ds.length):(o.stroke||"#26262e")}"
        stroke-width="${o.width||4}" stroke-linecap="round"
        stroke-linejoin="round"/>`).join("")}
      ${o.nums?ds.map((d,i)=>{const pt=startPt(d);
        return `<text x="${Math.min(101,pt[0]+2)}" y="${Math.max(9,pt[1]-2)}"
          font-size="8" font-weight="700" fill="${hue(i,ds.length)}">${i+1}</text>`;
        }).join(""):""}
    </svg>`;};
  const animate=host=>{
    const tok=++animTok;
    const paths=[...host.querySelectorAll("path")];
    (async()=>{
      while(tok===animTok&&document.body.contains(host)){
        for(const q of paths){q.style.transition="none";
          const L=q.getTotalLength();
          q.style.strokeDasharray=L;q.style.strokeDashoffset=L;}
        await sleep(380);if(tok!==animTok)return;
        for(const q of paths){
          const L=q.getTotalLength(),ms=Math.max(300,L*9);
          q.style.transition=`stroke-dashoffset ${ms}ms ease-in-out`;
          q.style.strokeDashoffset=0;
          await sleep(ms+140);if(tok!==animTok)return;}
        await sleep(1200);}})();};
  const nextKanji=()=>{
    if(ki>=targets.length)return done(score,`${targets.length} kanji practised`);
    const k=targets[ki];ki++;
    let stage=0,strokes=[],cur=null;
    const sent=ctx.sentenceFor(k);
    const sentHtml=sent?esc(sent.text).split(k).join(
      `<span style="color:var(--indigo);font-weight:700">${k}</span>`):"";
    el.innerHTML=`<div class="gstat"><span>kanji ${ki}/${targets.length} ·
        ${app.strokes[k].length} strokes</span><span>◈ ${score}</span></div>
      ${sentHtml?`<div class="fsent" style="text-align:center;margin:0 0 4px">${sentHtml}</div>`:""}
      <div class="wrow">
        <div class="wdemo" id="wDemo" style="width:${CELL}px;height:${CELL}px"></div>
        <div class="wcell" style="width:${CELL}px;height:${CELL}px">
          <div class="wghost" id="wGhost"></div>
          <canvas id="wPad"></canvas></div></div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn small ghost" id="wPlay">▶</button>
        <button class="btn small ghost" id="wUndo">↩</button>
        <button class="btn small ghost" id="wClear">消す</button>
        <button class="btn small" id="wNext">次へ</button></div>
      <div class="wstrip" id="wStrip"></div>
      <div class="stephint" style="text-align:center" id="wHint"></div>`;
    const demo=el.querySelector("#wDemo"),ghost=el.querySelector("#wGhost"),
          strip=el.querySelector("#wStrip"),padC=el.querySelector("#wPad");
    const dpr=Math.min(2,devicePixelRatio||1);
    padC.width=CELL*dpr;padC.height=CELL*dpr;
    const g=padC.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
    g.lineCap=g.lineJoin="round";g.strokeStyle="#26262e";
    const seg=(a,b)=>{g.lineWidth=Math.max(2,3.6*S*((b.p||0.55)/0.55));
      g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();};
    const redraw=()=>{g.clearRect(0,0,CELL,CELL);
      for(const st of strokes)for(let i=1;i<st.length;i++)seg(st[i-1],st[i]);};
    const pt=e=>{const r=padC.getBoundingClientRect();
      return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||0.55};};
    padC.onpointerdown=e=>{e.preventDefault();padC.setPointerCapture(e.pointerId);
      cur=[pt(e)];strokes.push(cur);};
    padC.onpointermove=e=>{if(!cur)return;const q=pt(e);
      seg(cur[cur.length-1],q);cur.push(q);};
    padC.onpointerup=padC.onpointercancel=()=>{cur=null;};
    const stageDemo=()=>{
      if(stage===0){demo.innerHTML=svgFor(k,{color:true,width:4});animate(demo);}
      else if(stage===1){animTok++;demo.innerHTML=svgFor(k,{color:true,nums:true,width:3.6});}
      else if(stage===2){animTok++;demo.innerHTML=svgFor(k,{width:4.4});}
      else{animTok++;
        demo.innerHTML=`<button class="btn small ghost" id="wPeek">見る</button>`;
        demo.querySelector("#wPeek").onclick=()=>{
          demo.innerHTML=svgFor(k,{width:4.4});
          setTimeout(()=>{if(stage===3)stageDemo();},900);};}
      el.querySelector("#wPlay").style.visibility=stage<3?"visible":"hidden";};
    const setStage=()=>{
      ghost.innerHTML=svgFor(k,{stroke:"#8d8672",width:4});
      ghost.style.opacity=GHOST[stage];
      el.querySelector("#wHint").textContent=`copy ${stage+1}/4 · ${HINTS[stage]}`;
      stageDemo();};
    el.querySelector("#wPlay").onclick=()=>{
      demo.innerHTML=svgFor(k,{color:true,width:4});animate(demo);};
    el.querySelector("#wUndo").onclick=()=>{strokes.pop();redraw();};
    el.querySelector("#wClear").onclick=()=>{strokes=[];redraw();};
    el.querySelector("#wNext").onclick=()=>{
      const th=document.createElement("canvas");
      th.width=th.height=92;
      th.getContext("2d").drawImage(padC,0,0,92,92);
      strip.appendChild(th);
      strokes=[];cur=null;redraw();
      stage++;
      if(stage<4){setStage();return;}
      animTok++;
      demo.innerHTML=svgFor(k,{width:4.4});
      ghost.style.opacity=0;
      el.querySelector("#wHint").textContent="how did the last one go?";
      const row=el.querySelector(".btnrow");
      row.innerHTML=`<button class="btn small" id="wGood">○ きれい</button>
        <button class="btn small ghost" id="wMeh">× もう一度いつか</button>`;
      el.querySelector("#wGood").onclick=()=>{score+=3;sfxGood();nextKanji();};
      el.querySelector("#wMeh").onclick=()=>{score+=1;nextKanji();};};
    setStage();};
  nextKanji();}};
